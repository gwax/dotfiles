add_newline = true
format = """
[╭─ ](dimgrey)\
$os\
$directory\
$git_branch\
$git_status\
$fill\
$status\
$all\
$line_break\
[╰─](dimgrey)\
$character
"""

right_format = """$memory_usage"""

palette = "gwax"

[palettes.gwax]
dimgrey = '#696969'        # #696969
crimson = '#DC143C'        # #DC143C
gold = '#FFD700'           # #FFD700
cornflowerblue = '#6495ED' # #6495ED
chartreuse = '#7FFF00'     # #7FFF00
darkturquoise = '#00CED1'  # #00CED1
darkorchid = '#9932CC'     # #9932CC
darkcyan = '#008B8B'       # #008B8B
darkgreen = '#006400'      # #006400
salmon = '#FA8072'         # #FA8072

[aws]
symbol = "  "

[buf]
symbol = " "

[bun]
symbol = " "

[c]
symbol = " "

[character]
success_symbol = "[❯](cornflowerblue)[❯](chartreuse)"
error_symbol = "[✖](crimson)[❯](gold)"

[cpp]
symbol = " "

[cmake]
symbol = " "

[cmd_duration]
format = ' [$duration]($style)'

[conda]
symbol = " "

[crystal]
symbol = " "

[dart]
symbol = " "

[deno]
symbol = " "

[directory]
style = "darkcyan"
truncation_length = 1
truncation_symbol = ""
truncate_to_repo = true
fish_style_pwd_dir_length = 1
format = '[ $path]($style)[$read_only]($read_only_style) [](dimmed dimgrey) '

[docker_context]
symbol = " "

[elixir]
symbol = " "

[elm]
symbol = " "

[fennel]
symbol = " "

[fill]
symbol = "-"
style = "dimmed dimgrey"

[fossil_branch]
symbol = " "

[gcloud]
symbol = "  "

[git_branch]
symbol = " "
style = "darkgreen"
format = '([$symbol$branch(:$remote_branch)]($style) )'

[git_commit]
tag_symbol = '  '

[git_status]
format = '([$all_status$ahead_behind]($style) )'
stashed = "≡"
ahead = '[⇡${count}](chartreuse)'
diverged = '[⇡${ahead_count}](chartreuse)[⇣${behind_count}](salmon)'
behind = '[⇣${count}](salmon)'
untracked = '[?${count}](cyan)'
modified = '[!${count}](gold)'
staged = '[+${count}](green)'
conflicted = '[✗${count}](crimson)'
renamed = '[⇄${count}](darkorchid)'
deleted = '[✖${count}](crimson)'

[golang]
symbol = " "

[guix_shell]
symbol = " "

[haskell]
symbol = " "

[haxe]
symbol = " "

[hg_branch]
symbol = " "

[hostname]
ssh_symbol = " "

[java]
symbol = " "

[julia]
symbol = " "

[kotlin]
symbol = " "

[lua]
symbol = " "

[memory_usage]
symbol = "󰍛 "
disabled = false
threshold = 0
format = "[$symbol[$ram](darkturquoise)(|[$swap](darkorchid))]($style)"

[meson]
symbol = "󰔷 "

[nim]
symbol = "󰆥 "

[nix_shell]
symbol = " "

[nodejs]
symbol = " "

[ocaml]
symbol = " "

